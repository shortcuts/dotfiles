gui:
  nerdFontsVersion: "3"
  border: rounded
  showRandomTip: false
  showCommandLog: false
  expandFocusedSidePanel: true
  # Narrow the left lists so side-by-side gets ~75% of the width
  sidePanelWidth: 0.25
  # Lazygit requires commits; the other panels stay hidden
  sidePanels:
    - [files]
    - [branches]
    - [commits]
  filterMode: fuzzy
  theme:
    activeBorderColor: ["cyan", "bold"]
    inactiveBorderColor: ["default"]
    selectedLineBgColor: ["reverse"]
    # Dim the default branch's line colors so feature branches stand out
    branchColorPatterns:
      "^(main|master)$": "#808080"
      "^feat/": "green"
      "^fix/": "red"
git:
  # Same delta settings as `git d` (from .gitconfig). {{columnWidth}} is half the diff pane minus 6, so double it back. Press | to cycle.
  diffRenderers:
    - command: sh -c 'delta --paging=never --width=$((2 * {{columnWidth}} + 12))'
      name: delta
    - command: delta --no-gitconfig --dark --paging=never --line-numbers
      name: delta-unified
    - type: rawGit
      args: [--color-words]
      name: color-words
os:
  editPreset: nvim
keybinding:
  files:
    refreshFiles: "<disabled>"
customCommands:
  # Lazygit custom commands cannot change focus or screen mode, so replay the keys through Rex
  - key: "r"
    context: "files"
    description: "Full-width diff"
    command: 'rex send-key -s "$REX_SESSION" -b "$REX_BLOCK" 0 && rex send-key -s "$REX_SESSION" -b "$REX_BLOCK" shift+='
  - key: "r"
    context: "commits"
    description: "Full-width diff"
    command: 'rex send-key -s "$REX_SESSION" -b "$REX_BLOCK" 0 && rex send-key -s "$REX_SESSION" -b "$REX_BLOCK" shift+='
  - key: "r"
    context: "commitFiles"
    description: "Full-width diff"
    command: 'rex send-key -s "$REX_SESSION" -b "$REX_BLOCK" 0 && rex send-key -s "$REX_SESSION" -b "$REX_BLOCK" shift+='
