# Generated by tmux-claude-code-status. Re-run the installer to regenerate.
# States: working (orange), stuck (red), idle (green).
set -gw window-status-format "#[fg=colour8]  #W #{?@agent_win_state,#{?#{==:#{@agent_win_state},stuck},#[fg=red],#{?#{==:#{@agent_win_state},working},#[fg=orange],#[fg=green]}}● #[default],}"
set -gw window-status-current-format "#[fg=orange] > #W #{?@agent_win_state,#{?#{==:#{@agent_win_state},stuck},#[fg=red],#{?#{==:#{@agent_win_state},working},#[fg=orange],#[fg=green]}}● #[default],}"
bind-key s choose-tree -Zs -F '#{?session_format,#{session_windows} windows#{?@agent_state, #{?#{==:#{@agent_state},stuck},#[fg=red],#{?#{==:#{@agent_state},working},#[fg=orange],#[fg=green]}}● #{@agent_state}#[default],},#{?window_format,#{window_name},}}'
