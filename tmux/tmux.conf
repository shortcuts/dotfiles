# base settings
set-option -g focus-events on
set-option -sa terminal-overrides ',screen-256color:RGB'
set-option -g default-terminal "screen-256color"
if-shell "test -x /opt/homebrew/bin/fish" \
    "set -g default-command /opt/homebrew/bin/fish; set -g default-shell /opt/homebrew/bin/fish" \
    "set -g default-command /usr/local/bin/fish; set -g default-shell /usr/local/bin/fish"
set -s escape-time 0
# clicks on the agent line; hold Shift to select text with the terminal instead
set -g mouse on
set -g base-index 1
set-option -g status-interval 5

unbind C-b
set-option -g prefix C-y
bind-key C-y send-prefix
set-option -g history-limit 50000

bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# vim like
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# bindings
bind Space last-window
bind-key v split-window -h
bind-key b split-window
bind-key q killp
bind -r n next-window
bind -r p previous-window
bind-key k clear-history
bind-key - resize-pane -U 10
bind-key = resize-pane -D 10

# sessions
# closing a session's last pane lands in another session, not the shell
set -g detach-on-destroy off
bind-key s choose-tree -Zs -O name
# argv form skips default-shell: fish startup reruns mise env when the server env is stale (~300ms)
bind-key f display-popup -E -w 70% -h 60% bash "$HOME/.config/scripts/tmux-session-finder"

bind-key C-c run-shell "~/.config/scripts/tmux-session-finder ~/.config"
bind-key C-n run-shell "~/.config/scripts/tmux-session-finder ~/Documents/no-neck-pain.nvim"

# Ghostty sends M-<n> for cmd+<n>; list-sessions sorts by name, the same order as the status lines
run-shell 'for i in 1 2 3 4 5 6 7 8 9; do tmux bind -n M-$i run-shell "s=\$(tmux ls | sed -n \"${i}s/:.*//p\"); [ -z \"\$s\" ] || tmux switch-client -t \"=\$s\""; done'

############ THEME
# palette: github_dark_dimmed, from projekt0n/github-theme-contrib
# layout stays custom: the upstream port hardcodes a powerline bar

# status
# lines 0 and 1 list every agent pane the plugin tags with @pane_agent, and each session without one
set -g status 3
set -g status-justify "left"
set -g status-left ""
set -g status-position "top"
set -g status-right "#(~/.config/scripts/tmux-git-status '#{pane_current_path}') "
set -g status-right-length 80
set -g status-bg "#22272e"
set -g status-fg "#adbac7"

set -g message-style "fg=#22272e,bg=#adbac7"
set -g message-command-style "fg=#22272e,bg=#adbac7"

# panes
set -g pane-border-style fg="#444c56"
set -g pane-active-border-style fg="#539bf5"

# windows
setw -g window-status-activity-style "bg=default"
setw -g window-status-style "bg=default"

# agents: line 0 has a dot per agent and its repo, line 1 the branch under it
# sessions follow the name order of <prefix> s, so an agent-less session sits in its slot
# a lighter background marks the client's own session
# a click jumps to the agent's pane or the session: switch-client -t = ignores range=pane, so a user range
# names it, and run -C expands the target, which switch-client leaves as a literal
bind -n MouseDown1Status if -F '#{m:[%$]*,#{mouse_status_range}}' { run -C 'switch-client -t "#{mouse_status_range}"' } { switch-client -t = }
# columns per entry, so the labels shrink to fit every agent and session on screen
# each session box takes 3 columns of padding: 2 inside, 1 after
# S/n as in the status lines: tmux shares one sorted list, so an unsorted S here reorders theirs
set -g @agent_cols '#{e|/:#{e|-:#{client_width},#{e|*:3,#{n:#{S/n:x}}}},#{n:#{S/n:#{?#{W:#{P:#{?#{@pane_agent},x,}}},#{W:#{P:#{?#{@pane_agent},x,}}},x}}}}'
set -g status-format[0] '#[align=left]#{S/n:#{?#{==:#{session_name},#{client_session}},#[bg=#2d333b],}  #{?#{W:#{P:#{?#{@pane_agent},x,}}},#{W:#{P:#{?#{@pane_agent},#[range=user|#{pane_id}]#{?#{==:#{@pane_status},idle},#[fg=#57ab5a],#{?#{||:#{==:#{@pane_status},waiting},#{==:#{@pane_status},error}},#[fg=#e5534b],#[fg=#f69d50]}}● #(~/.config/scripts/tmux-agent-label "#{pane_current_path}" repo #{E:@agent_cols})#[norange] ,}}},#[range=user|#{session_id}]#[fg=#768390]○ #(~/.config/scripts/tmux-agent-label "#{pane_current_path}" repo #{E:@agent_cols} "#{session_name}")#[norange] }#[bg=default] }'
set -g status-format[1] '#[align=left]#{S/n:#{?#{==:#{session_name},#{client_session}},#[bg=#2d333b],}  #{?#{W:#{P:#{?#{@pane_agent},x,}}},#{W:#{P:#{?#{@pane_agent},#[range=user|#{pane_id}]  #(~/.config/scripts/tmux-agent-label "#{pane_current_path}" branch #{E:@agent_cols})#[norange] ,}}},#[range=user|#{session_id}]  #(~/.config/scripts/tmux-agent-label "#{pane_current_path}" branch #{E:@agent_cols} "#{session_name}")#[norange] }#[bg=default] }'
# tmux's default line 0, moved last so the session lines come first
set -g status-format[2] '#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]'

# window-status
setw -g window-status-format "#[fg=#768390]  #W "
setw -g window-status-current-format "#[fg=#539bf5,bold] > #W "

# Modes
setw -g mode-style fg="#22272e",bg="#adbac7",bold

# plugins
# ~/.tmux/plugins, not the XDG default: the plugin's Claude hook looks only there for its binary
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'
# kept for its hooks, which set @pane_agent and @pane_status, and its desktop notifications
set -g @plugin 'hiroppy/tmux-agent-sidebar'
# status lines 0 and 1 replace the sidebar; <prefix> e still opens one on demand
set -g @sidebar_auto_create off
run -b '~/.tmux/plugins/tpm/tpm'
