onboarding = false
# herdr configuration
# Mirrors tmux/tmux.conf: prefix key, vim-style pane nav, split keys.
# See tmux/tmux.conf and herdr --default-config for the full option list.

[terminal]
# $SHELL env var is stale (/bin/zsh) even though chsh set fish as login shell.
# Bare name (not full path) so it resolves via PATH on both /usr/local and
# /opt/homebrew Macs.
default_shell = "fish"

[keys]
prefix = "ctrl+y"

reload_config = "prefix+r"
detach = "prefix+d"        # freed prefix+q below to match tmux's kill-pane key

# vim-style pane navigation, matches tmux `bind -r h/j/k/l select-pane`
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# prefix+s opens navigate mode: up/down moves between workspaces (spaces),
# hjkl moves between panes, enter confirms
goto = "prefix+s"
navigate_workspace_up = "up"
navigate_workspace_down = "down"
navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"

# tmux: bind-key v split-window -h (side by side)
split_vertical = "prefix+v"
# tmux: bind-key b split-window (stacked)
split_horizontal = "prefix+b"

# tmux: bind-key q killp
close_pane = "prefix+q"

# tmux: prefix+[ (copy-mode-vi) -- opens scrollback in $EDITOR instead, so
# you get real vim hjkl/G/gg/? search rather than a copy-mode subset
edit_scrollback = "prefix+["

# tmux: bind -r n/p next-window/previous-window (already herdr defaults)
next_tab = "prefix+n"
previous_tab = "prefix+p"

# tmux default: prefix+c new-window
new_tab = "prefix+c"
# herdr default is prefix+shift+x; rebound to plain prefix+x, tmux prefix+x kills pane
close_tab = "prefix+x"

# tmux: bind-key -r f run-shell "tmux neww ~/.config/scripts/tmux-session-finder"
[[keys.command]]
key = "prefix+f"
type = "pane"
command = "~/.config/scripts/herdr-session-finder"

[ui]
accent = "orange"  # matches tmux active-pane-border / window-status-current

# no prompt on new tab/workspace, but ask before closing a workspace
prompt_new_tab_name = false
prompt_new_workspace_name = false
confirm_close = true

show_agent_labels_on_pane_borders = false
agent_panel_sort = "spaces"
[ui.toast]
delivery = "system"

[theme]
name = "gruvbox"
auto_switch = false
