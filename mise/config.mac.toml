# Extra tools for the full Mac. Loaded on top of config.toml by MISE_ENV=mac.
[tools]
# Same rule as config.toml: toolchains float, projects pin their own.
go = "1.27.3"
# Pinned, not floating: mise's latest is already 0.16.0.
zig = "0.17.0"
# CLIs are pinned so both Macs run identical binaries. Bump with `mise up --bump`.
actionlint = "1.7.12"
ansible = { version = "14.5.0", expose = ["ansible-core"] }
aws-cli = { version = "2.39.3", symlink_bins = "true" }
azure-kubelogin = "0.2.22"
bat = "0.26.1"
biome = "2.6.4"
cargo-binstall = "1.26.2"
ccache = "4.14.2"
cfssl = "1.7.1"
cfssljson = "1.7.1" # minimetis needs both cfssl binaries.
cloc = "2.10"
cmake = "4.4.5"
crane = "0.22.1"
dotenv-linter = "4.0.0"
eksctl = "0.231.0"
fastfetch = "2.70.0"
# Absent from mise's own registry, so pull it straight from aqua.
"aqua:dlvhdr/gh-dash" = "4.26.2"
git-cliff = "2.14.2"
glow = "3.0.0"
golangci-lint = "2.15.0" # Metis CI pins this version in lint-go.yml.
gum = "2.0.2"
# Held at 3.x: helm 4 is a breaking major, and the clusters still run v3 charts.
helm = "4.3.1"
helmfile = "1.8.2"
k3d = "5.9.0"
k9s = "0.51.0"
kind = "0.33.0"
ktlint = "1.8.0"
kubeconform = "0.8.0"
kubectl = "1.37.2"
kubectx = "0.11.0"
kustomize = "5.8.3"
lazydocker = "0.25.2"
# Absent from mise's registry. The macOS CLI asset is a universal binary, so both Macs share it.
"github:harry0703/MangoDisk" = { version = "1.2.2", matching = "macos-cli", bin = "mangodisk", os = ["macos"] }
ko = "0.19.1"
minikube = "1.39.0"
mkcert = "1.4.4"
pipx = "1.18.11"
pnpm = "12"
poetry = "2.5.1"
# Absent from mise's registry. Releases ship aarch64 and x86_64 darwin binaries.
"github:achristmascarl/rainfrog" = "0.4.6"
redis = "8.10.2"
ruff = "0.17.3"
skaffold = "2.25.0"
task = "3.54.0"
terraform = "1.17.1"
tree-sitter = "0.27.1"
# mise's pypi backend shells out to uvx, so ansible needs uv present.
uv = "latest"
vale = "3.26.0"
vault = "2.2.1"
yamllint = "1.38.0"
yarn = "4.18.1"
yq = "4.54.1"
# Renovate's mise manager does not track the conda and github backends, so bump
# these by hand.
# Python 3.14: azure-cli's pymsalruntime dependency has no cp315 wheel yet, and python floats to 3.15.
"pypi:azure-cli" = { version = "2.91.0", uvx_args = "--python 3.14" }
"npm:markdownlint-cli2" = "0.24.0" # nvim diagnostics (nvim/lua/plugins/md.lua).
"conda:bash" = "5.3"      # macOS ships bash 3.2; Metis scripts use `declare -A` and `mapfile`.
"conda:postgresql" = "18.6"  # psql only; the server itself runs in Docker.
"github:lework/skopeo-binary" = { version = "1.24.1", bin_path = ".", rename_exe = "skopeo" } # skopeo is absent from the mise registry.
# Menu bar app; the release zip holds a bundle with no top-level folder, so the binary sits in Contents/MacOS.
"github:shortcuts/obsidian-quickadd-macos-menubar" = { version = "latest", bin_path = "Contents/MacOS", postinstall = "ln -sfn \"$MISE_TOOL_INSTALL_PATH/QuickAddMenubar.app\" ~/Applications/QuickAddMenubar.app" }
