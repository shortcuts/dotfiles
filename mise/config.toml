# Lite set: what the Mac mini needs for locationjoystick, no-neck-pain.nvim, anko,
# clidraw, pgpemu and radin. Everything else lives in config.mac.toml, which only the full
# Mac loads (MISE_ENV=mac, set by install.sh through miserc.toml).
# Language toolchains float: projects pin their own versions, global is a fallback.
[tools]
java = "latest"
node = "latest"
python = "latest"
rust = "latest"
bats = "1.14.0" # radin tests.
bob = "4.1.7"
# Floats, unlike the other CLIs: Anthropic ships a release most days and the CLI
# warns when it trails. Was the `claude-code` brew cask.
claude-code = "latest"
# 0.19.0 dropped x86_64-apple-darwin; 0.18.2 is the last release with an Intel Mac binary.
delta = "0.18.2"
# Absent from mise's registry. Releases ship a bare binary per target, including both Macs.
"github:dmtrKovalenko/fff" = { version = "0.11.0", matching = "fff-mcp", rename_exe = "fff-mcp" }
fd = "10.3.0"
fzf = "0.74.4"
gh = "2.101.0"
jq = "1.8.2"
ripgrep = "15.2.0"
starship = "1.26.0"
shellcheck = "0.11.0"
shfmt = "3.14.1"
stylua = "2.5.2"
"npm:ccstatusline" = "2.2.29"
"aqua:rtk-ai/rtk" = "latest"
