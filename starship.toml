"$schema" = 'https://starship.rs/config-schema.json'

# branch and diff stats live in the tmux status-right (scripts/tmux-git-status)
format = """$directory[❯](dimmed white) """

# repo root name only; empty outside a repo, like the tmux status-right
[directory]
format = ""
repo_root_format = "[$repo_root]($repo_root_style) "
repo_root_style = "dimmed white"
