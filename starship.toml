"$schema" = 'https://starship.rs/config-schema.json'

# the Mac runs under heavy load; spawning git alone can exceed the 500 ms default
command_timeout = 2000

# the session name already shows the directory, so only branch and git state show here
format = """$git_branch$git_status[❯](dimmed white) """

# empty outside a repo
[git_branch]
format = "[$branch]($style) "
style = "dimmed white"

# built-in module: no process spawns, which the endpoint scanner makes slow
[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "dimmed white"
