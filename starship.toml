"$schema" = 'https://starship.rs/config-schema.json'

# the Mac runs under heavy load; spawning git alone can exceed the 500 ms default
command_timeout = 2000

# the session name already shows the directory, so only branch and git state show here
format = """$git_branch$custom[❯](dimmed white) """

# empty outside a repo
[git_branch]
format = "[$branch]($style) "
style = "dimmed white"

# the script caches for a few seconds; counts come from the local upstream ref, so run `git fetch` to refresh them
[custom.git_local]
when = true
command = "~/.config/scripts/starship-git-local"
format = "([$output]($style) )"
style = "dimmed white"
