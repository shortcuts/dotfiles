"$schema" = 'https://starship.rs/config-schema.json'

# diff stats live in the tmux status-right (scripts/tmux-git-status); the session name already shows the directory, so only the branch shows here
format = """$git_branch[❯](dimmed white) """

# empty outside a repo
[git_branch]
format = "[$branch]($style) "
style = "dimmed white"
